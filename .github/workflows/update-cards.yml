name: Update profile cards

# Regenerates the self-hosted SVG cards (assets/stats-*.svg, assets/activity-*.svg) from the GitHub API.
# No third-party services: the script is scripts/generate-cards.mjs and has no dependencies.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-cards.mjs"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node scripts/test-cards.mjs

      - name: Generate cards
        run: node scripts/generate-cards.mjs assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg assets/activity-dark.svg assets/activity-light.svg
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
