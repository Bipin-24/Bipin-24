<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
<title id="t">Bipin Pandey: I build the layer AI systems retrieve from and reason over</title>
<desc id="d">Animated banner. A small knowledge graph with typed relationships (VALIDATES, GENERATES, COVERS, EVALUATED_BY) connecting an ontology, a graph, MCP tools, chunks and RAGAS evaluation.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080F"/><stop offset="1" stop-color="#0B1226"/></linearGradient>
 <linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#7C93FF"/><stop offset="1" stop-color="#2EE6C8"/></linearGradient>
 <radialGradient id="g1" cx=".15" cy="0" r=".7"><stop offset="0" stop-color="rgba(124,147,255,.30)"/><stop offset="1" stop-color="rgba(124,147,255,.30)" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2" cx=".95" cy=".2" r=".6"><stop offset="0" stop-color="rgba(46,230,200,.18)"/><stop offset="1" stop-color="rgba(46,230,200,.18)" stop-opacity="0"/></radialGradient>
 <clipPath id="c"><rect width="1280" height="340" rx="20"/></clipPath>
</defs>
<style>
 .flow{stroke-dasharray:7 7;animation:flow 1.8s linear infinite}
 .pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .p2{animation-delay:.6s} .p3{animation-delay:1.2s} .p4{animation-delay:1.8s} .p5{animation-delay:2.4s}
 .rise{animation:rise .9s cubic-bezier(.2,.7,.3,1) both} .r2{animation-delay:.12s} .r3{animation-delay:.24s} .r4{animation-delay:.36s}
 @keyframes flow{to{stroke-dashoffset:-28}}
 @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
 @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
 <rect width="1280" height="340" fill="url(#bg)"/><rect width="1280" height="340" fill="url(#g1)"/><rect width="1280" height="340" fill="url(#g2)"/>
 <!-- faint background lattice -->
 <g stroke="rgba(255,255,255,.14)" stroke-width="1" fill="none" opacity=".9">
  <path d="M640 40 L760 120 L850 230 M760 120 L930 70 L1090 130 L1030 250 L850 230 M930 70 L850 230 M1090 130 L1190 80 M1190 80 L1240 200 L1030 250"/>
 </g>
 <!-- typed edges -->
 <g fill="none" stroke-width="2.2" stroke-linecap="round">
  <path class="flow" d="M760 120 L930 70" stroke="#F6B65B"/>
  <path class="flow" d="M930 70 L1090 130" stroke="#2EE6C8"/>
  <path class="flow" d="M930 70 L850 230" stroke="#7C93FF"/>
  <path class="flow" d="M850 230 L1030 250" stroke="#F6B65B"/>
 </g>
 <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing=".6" text-anchor="middle">
  <text x="845" y="84" fill="#F6B65B" transform="rotate(-16 845 84)">VALIDATES</text>
  <text x="1018" y="92" fill="#2EE6C8" transform="rotate(20 1018 92)">GENERATES</text>
  <text x="868" y="150" fill="#7C93FF" transform="rotate(-62 868 150)">COVERS</text>
  <text x="944" y="252" fill="#F6B65B" transform="rotate(7 944 252)">EVALUATED_BY</text>
 </g>
 <!-- nodes -->
 <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" text-anchor="middle">
  <g><circle class="pulse" cx="760" cy="120" r="22" fill="#F6B65B" opacity=".18"/><circle cx="760" cy="120" r="9" fill="#0E1630" stroke="#F6B65B" stroke-width="2.4"/><text x="760" y="152" fill="#EAF0FA">Ontology</text></g>
  <g><circle class="pulse p2" cx="930" cy="70" r="26" fill="#2EE6C8" opacity=".18"/><circle cx="930" cy="70" r="11" fill="#0E1630" stroke="#2EE6C8" stroke-width="2.6"/><text x="930" y="38" fill="#EAF0FA">Knowledge graph</text></g>
  <g><circle class="pulse p3" cx="1090" cy="130" r="22" fill="#7C93FF" opacity=".2"/><circle cx="1090" cy="130" r="9" fill="#0E1630" stroke="#7C93FF" stroke-width="2.4"/><text x="1090" y="164" fill="#EAF0FA">MCP tools</text></g>
  <g><circle class="pulse p4" cx="850" cy="230" r="22" fill="#7C93FF" opacity=".2"/><circle cx="850" cy="230" r="9" fill="#0E1630" stroke="#7C93FF" stroke-width="2.4"/><text x="850" y="266" fill="#EAF0FA">Chunks</text></g>
  <g><circle class="pulse p5" cx="1030" cy="250" r="22" fill="#F6B65B" opacity=".18"/><circle cx="1030" cy="250" r="9" fill="#0E1630" stroke="#F6B65B" stroke-width="2.4"/><text x="1030" y="286" fill="#EAF0FA">RAGAS eval</text></g>
 </g>
 <!-- copy -->
 <g>
  <g class="rise"><circle cx="72" cy="62" r="5" fill="#2EE6C8"/><circle cx="72" cy="62" r="10" fill="#2EE6C8" opacity=".2"/>
   <text x="92" y="67" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#A3AFC4">AI KNOWLEDGE ENGINEER  ·  ONTOLOGIES  ·  MCP  ·  RAG</text></g>
  <text class="rise r2" x="70" y="140" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="500" letter-spacing="-1.2" fill="#EAF0FA">I build the layer AI systems</text>
  <text class="rise r3" x="70" y="204" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="500" letter-spacing="-1.2" fill="#EAF0FA"><tspan font-style="italic" fill="url(#gr)">retrieve from</tspan> and <tspan font-style="italic" fill="url(#gr)">reason over</tspan>.</text>
  <text class="rise r4" x="72" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#EAF0FA">bipin pandey<tspan fill="#2EE6C8">.</tspan></text>
  <text class="rise r4" x="72" y="290" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#7F8CA3">typed knowledge  ·  agent tools  ·  evaluated retrieval</text>
 </g>
</g>
<rect x=".5" y=".5" width="1279" height="339" rx="19.5" fill="none" stroke="rgba(255,255,255,.14)"/>
</svg>
