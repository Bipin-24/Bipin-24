<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" role="img" aria-labelledby="t d">
<title id="t">How my projects fit together</title>
<desc id="d">Six repositories grouped under three ideas: ontology and knowledge graph (simonto, knowledge-graphs-for-ia), typed agent tools over MCP (docs-mcp, docs-style-guard), and evaluated retrieval (knowflow, Documentation-AI-Assistant). simonto generates typed MCP tools, and knowflow is the evolution of docs-mcp. Knowlayer and the Information Architecture Playbook document the approach.</desc>
